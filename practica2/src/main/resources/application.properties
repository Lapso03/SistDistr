spring.application.name=${APP_CONTAINER_NAME_DES:basicoApp}

#Indica el driver/lib para conectar java a mysql
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

#Url donde esta el servicio de tu mysql y el nombre de la base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3506/demosd}

#Usuario y contrasena para tu base de datos descrita en la linea anterior
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eneas2805}

#[opcional]Imprime en tu consola las instrucciones hechas en tu base de datos.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}

#habilitamos la pagina de error generico
server.port=${SERVER_PORT:8085}