<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test de Excepciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="/">⚡ PokéApp</a>
  <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
</nav>

<div class="container mt-5" style="max-width: 800px">

  <h2 class="fw-bold mb-4">🧪 Test de Excepciones</h2>

  <!-- 🔴 CRÍTICAS -->
  <div class="mb-4">
    <h5 class="text-danger">Errores críticos</h5>

    <a href="/admin/test/bbdd" class="btn btn-dark w-100 mb-2">
      💾 Error Base de Datos
    </a>

    <a href="/admin/test/generico" class="btn btn-secondary w-100 mb-2">
      💥 Error Genérico
    </a>
  </div>

  <!-- 🟠 EXTERNAS -->
  <div class="mb-4">
    <h5 class="text-warning">Errores externos</h5>

    <a href="/admin/test/api" class="btn btn-danger w-100 mb-2">
      🌐 API caída (Flask apagado)
    </a>

    <a href="/admin/test/flask" class="btn btn-warning w-100 mb-2">
      ⚙️ Error interno Flask
    </a>

    <a href="/admin/test/timeout" class="btn btn-outline-warning w-100 mb-2">
      ⏱️ Timeout API
    </a>
  </div>

  <!-- 🟢 FUNCIONALES -->
  <div class="mb-4">
    <h5 class="text-success">Errores funcionales</h5>

    <a href="/admin/test/pokemon" class="btn btn-primary w-100 mb-2">
      ❌ Pokémon no encontrado
    </a>

    <a href="/admin/test/param" class="btn btn-info w-100 mb-2">
      ⚠️ Parámetro inválido
    </a>
  </div>

  <!-- ✅ OK -->
  <div class="mb-4">
    <h5 class="text-success">Caso correcto</h5>

    <a href="/admin/test/saludo" class="btn btn-success w-100">
      ✅ Petición correcta
    </a>
  </div>

</div>

</body>
</html>
