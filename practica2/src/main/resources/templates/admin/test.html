<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="/">⚡ PokéApp</a>
  <div class="d-flex gap-2">
    <a href="/admin" class="btn btn-outline-light btn-sm">← Panel</a>
    <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="fw-bold">🧪 Test de excepciones</h2>
  <p class="text-muted">Endpoints de la API Python — solo visible para administradores.</p>

  <div class="d-flex flex-wrap gap-2 mb-4">
    <a href="/admin/test/saludo" class="btn btn-success">✅ Saludo</a>
    <a href="/admin/test/archivo" class="btn btn-warning">📄 Error de archivo</a>
    <a href="/admin/test/bbdd" class="btn btn-warning">🗄️ Error de base de datos</a>
    <a href="/admin/test/pokemon" class="btn btn-warning">🎮 Error de Pokémon API</a>
  </div>

  <div th:if="${resultado}">
    <h5>Resultado — <span th:text="${tipo}"></span></h5>
    <div th:if="${resultado['estado'] == 'ok'}" class="alert alert-success">
      <strong>✅ OK:</strong> <span th:text="${resultado['mensaje']}"></span>
    </div>
    <div th:if="${resultado['estado'] == 'error'}" class="alert alert-danger">
      <strong>⚠️ Error traducido:</strong> <span th:text="${resultado['mensaje']}"></span>
    </div>
  </div>

  <div th:if="${resultado == null}" class="alert alert-info">
    Pulsa un botón para probar un endpoint.
  </div>
</div>
</body>
</html>
