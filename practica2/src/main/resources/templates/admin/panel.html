<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Admin</title>
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous"
  >
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="/">⚡ PokéApp</a>
  <div class="d-flex gap-2">
    <a href="/admin/test" class="btn btn-outline-warning btn-sm">🧪 Test API</a>
    <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="fw-bold">🛠️ Panel de administración</h2>
  <p class="text-muted">Gestiona los roles de los usuarios registrados.</p>

  <div class="card shadow">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Rol actual</th>
          <th>Cambiar rol</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
          <td th:text="${u.id}"></td>
          <td th:text="${u.username}"></td>
          <td>
                            <span th:text="${u.userRole != null ? u.userRole.roleName : 'Sin rol'}"
                                  class="badge bg-secondary"></span>
          </td>
          <td>
            <form action="/admin/rol" method="post" class="d-flex gap-2">
              <input type="hidden" name="userId" th:value="${u.id}">
              <select name="roleName" class="form-select form-select-sm" style="width:120px">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
              </select>
              <button type="submit" class="btn btn-sm btn-primary">Aplicar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
