services:
  mysqldb:
    image: mysql:8.0.31-oracle
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQLDB_ROOT_PASSWORD_DES}
      - MYSQL_DATABASE=${MYSQLDB_DATABASE_DES}
      - MYSQL_USER=${MYSQLDB_USER_DES}
      - MYSQL_PASSWORD=${MYSQLDB_ROOT_PASSWORD_DES}
    ports:
      - "${MYSQLDB_LOCAL_PORT_DES}:${MYSQLDB_DOCKER_PORT_DES}"
    volumes:
      - db:/var/lib/mysql
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  webapp:
    container_name: ${APP_CONTAINER_NAME_DES}
    depends_on:
      - mysqldb
    build:
      context: .
    restart: on-failure
    env_file: ./.env
    ports:
      - "${SPRING_LOCAL_PORT_DES}:${SPRING_DOCKER_PORT_DES}"
    environment:
      - APP_CONTAINER_NAME_DES=${APP_CONTAINER_NAME_DES}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:${MYSQLDB_DOCKER_PORT_DES}/${MYSQLDB_DATABASE_DES}?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQLDB_USER_DES}
      - SPRING_DATASOURCE_PASSWORD=${MYSQLDB_ROOT_PASSWORD_DES}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - SERVER_PORT=${SPRING_DOCKER_PORT_DES}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit
    container_name: taller-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Panel web
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: taller-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Panel web admin
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    networks:
      - app-network
volumes:
  db:

networks:
  app-network:
    driver: bridge