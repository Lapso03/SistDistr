<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
            crossorigin="anonymous"
    >
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">⚡ PokéApp</a>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white small">Hola, <strong th:text="${username}"></strong></span>
        <a href="/pokemon" class="btn btn-outline-light btn-sm">Buscar Pokémon</a>
        <a th:if="${isAdmin}" href="/admin" class="btn btn-warning btn-sm">Panel Admin</a>
        <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
    </div>
</nav>

<div class="container mt-5 text-center">
    <h1 class="display-4 fw-bold">Bienvenido, <span th:text="${username}"></span> 👋</h1>
    <p class="text-muted fs-5 mt-2">¿Qué quieres hacer hoy?</p>

    <div class="row justify-content-center mt-4 gap-3">
        <div class="col-md-4 card shadow p-4">
            <div class="fs-1">🔍</div>
            <h5 class="mt-2">Buscar Pokémon</h5>
            <p class="text-muted small">Busca cualquier Pokémon y consulta sus stats</p>
            <a href="/pokemon" class="btn btn-primary">Ir al buscador</a>
        </div>
        <div th:if="${isAdmin}" class="col-md-4 card shadow p-4">
            <div class="fs-1">🛠️</div>
            <h5 class="mt-2">Panel de administración</h5>
            <p class="text-muted small">Gestiona usuarios y prueba los endpoints</p>
            <a href="/admin" class="btn btn-warning">Ir al panel</a>
        </div>
    </div>
</div>
</body>
</html>
