<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login · EventApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
        crossorigin="anonymous">
  <style>
    body {
      background-color: #f5f6fa;
      min-height: 100vh;
    }
    .login-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .brand-title { color: #2c3e50; font-weight: 800; font-size: 1.8rem; }
    .brand-title span { color: #e94560; }
    .btn-login { background: #e94560; color: white; border: none; font-weight: 700; }
    .btn-login:hover { background: #c73652; color: white; }
    .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 0.2rem rgba(233,69,96,0.2); }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="login-card card p-5" style="width: 400px">
  <div class="text-center mb-4">
    <div class="brand-title">Event<span>App</span></div>
    <p class="text-muted mt-1">Inicia sesión en tu cuenta</p>
  </div>

  <div th:if="${param.error}" class="alert alert-danger py-2">
    <small>Usuario o contraseña incorrectos.</small>
  </div>
  <div th:if="${param.logout}" class="alert alert-success py-2">
    <small>Sesión cerrada correctamente.</small>
  </div>
  <div th:if="${param.registrado}" class="alert alert-success py-2">
    <small>✅ Cuenta creada. Ya puedes iniciar sesión.</small>
  </div>

  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Usuario</label>
      <input type="text" class="form-control" name="username" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Contraseña</label>
      <input type="password" class="form-control" name="password" required>
    </div>
    <button type="submit" class="btn btn-login w-100 btn-lg">Entrar</button>
  </form>

  <hr class="my-4">
  <div class="text-center">
    <span class="text-muted small">¿No tienes cuenta?</span>
    <a th:href="@{/registro}" class="text-decoration-none fw-semibold ms-1"
       style="color:#e94560">Regístrate</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>
