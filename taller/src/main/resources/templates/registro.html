<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro · EventApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
        crossorigin="anonymous">
  <style>
    body {
      background-color: #f5f6fa;
      min-height: 100vh;
    }
    .registro-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .brand-title { color: #2c3e50; font-weight: 800; font-size: 1.8rem; }
    .brand-title span { color: #e94560; }
    .btn-registro { background: #e94560; color: white; border: none; font-weight: 700; }
    .btn-registro:hover { background: #c73652; color: white; }
    .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 0.2rem rgba(233,69,96,0.2); }
    .requisito { font-size: 0.8rem; color: #888; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="registro-card card p-5" style="width: 420px">
  <div class="text-center mb-4">
    <div class="brand-title">Event<span>App</span></div>
    <p class="text-muted mt-1">Crea tu cuenta gratis</p>
  </div>

  <form th:action="@{/registro}" method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Usuario</label>
      <input type="text" class="form-control" name="username"
             required minlength="3" maxlength="50"
             placeholder="Mínimo 3 caracteres">
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Contraseña</label>
      <input type="password" class="form-control" name="password"
             required minlength="6"
             placeholder="Mínimo 6 caracteres">
      <div class="requisito mt-1">Al menos 6 caracteres</div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" class="form-control" name="email"
             placeholder="tu@email.com">
      <div class="form-text">Opcional. Para recibir confirmaciones y recordatorios.</div>
    </div>
    <button type="submit" class="btn btn-registro w-100 btn-lg">Crear cuenta</button>
  </form>

  <hr class="my-4">
  <div class="text-center">
    <span class="text-muted small">¿Ya tienes cuenta?</span>
    <a th:href="@{/login}" class="text-decoration-none fw-semibold ms-1"
       style="color:#e94560">Inicia sesión</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>
