<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title th:text="${evento.nombre} + ' · EventApp'">Detalle Evento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { background-color: #f5f6fa; }
    .navbar-brand span { color: #e94560; }
    .hero-evento {
      background: linear-gradient(135deg, #2c3e50 0%, #e94560 100%);
      min-height: 280px;
      display: flex;
      align-items: flex-end;
    }
    .hero-evento-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.2;
    }
    .hero-wrapper { position: relative; overflow: hidden; }
    .badge-categoria { background: #e94560; font-size: 0.8rem; }
    .info-card { border: none; border-radius: 16px; }
    .precio-grande { font-size: 2rem; font-weight: 800; color: #2c3e50; }
    .aforo-bar { height: 8px; }
    #map { height: 350px; border-radius: 12px; overflow: hidden; z-index: 0; }
    .detalle-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: #eaf0fb;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color:#2c3e50">
  <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMenu">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
      <li class="nav-item"><a class="nav-link" href="/eventos/buscar">Explorar eventos</a></li>
    </ul>
    <div class="d-flex align-items-center gap-3">
      <a href="/usuario/reservas" class="btn btn-outline-light btn-sm">🎟️ Mis reservas</a>
      <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
    </div>
  </div>
</nav>

<div class="hero-wrapper hero-evento text-white">
  <img th:if="${evento.imagen != null and !evento.imagen.isEmpty()}"
       th:src="${evento.imagen}" class="hero-evento-img" th:alt="${evento.nombre}">
  <div class="container py-4 position-relative">
    <span class="badge badge-categoria mb-3" th:text="${evento.categoria}"></span>
    <h1 class="display-5 fw-bold" th:text="${evento.nombre}"></h1>
    <p class="mb-0" style="color:rgba(255,255,255,0.8)">
      📍 <span th:text="${evento.lugar}"></span>
    </p>
  </div>
</div>

<div class="container py-5">
  <div class="row g-4">

    <div class="col-lg-8">

      <div class="card info-card shadow-sm p-4 mb-4">
        <h5 class="fw-bold mb-3">Sobre este evento</h5>
        <p class="text-muted" th:text="${evento.descripcion}"></p>
      </div>

      <div class="card info-card shadow-sm p-4 mb-4">
        <h5 class="fw-bold mb-4">Detalles</h5>
        <div class="d-flex flex-column gap-3">
          <div class="d-flex align-items-center gap-3">
            <div class="detalle-icon">📅</div>
            <div>
              <div class="small text-muted">Fecha y hora</div>
              <div class="fw-semibold"
                   th:text="${#temporals.format(evento.fecha, 'EEEE, dd MMMM yyyy · HH:mm')}"></div>
            </div>
          </div>
          <div class="d-flex align-items-center gap-3">
            <div class="detalle-icon">📍</div>
            <div>
              <div class="small text-muted">Lugar</div>
              <div class="fw-semibold" th:text="${evento.lugar}"></div>
              <a th:href="'https://www.google.com/maps/dir/?api=1&destination=' + ${evento.latitud} + ',' + ${evento.longitud}"
                 target="_blank" class="small text-decoration-none"
                 style="color:#e94560">
                <span th:text="${evento.direccion}"></span> ↗
              </a>
            </div>
          </div>
          <div class="d-flex align-items-center gap-3">
            <div class="detalle-icon">👥</div>
            <div>
              <div class="small text-muted">Aforo</div>
              <div class="fw-semibold"
                   th:text="${evento.aforoDisponible} + ' entradas disponibles de ' + ${evento.aforo}"></div>
              <div class="progress aforo-bar mt-1" style="width: 200px">
                <div class="progress-bar"
                     th:style="'width:' + ${(evento.aforoOcupado * 100) / evento.aforo} + '%'"
                     th:classappend="${evento.aforoDisponible < 10} ? 'bg-danger' : 'bg-success'">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card info-card shadow-sm p-4">
        <h5 class="fw-bold mb-3">📍 Ubicación</h5>
        <div id="map"
             th:data-lat="${evento.latitud}"
             th:data-lng="${evento.longitud}"
             th:data-nombre="${evento.nombre}"
             th:data-direccion="${evento.direccion}">
        </div>
        <p class="small text-muted mt-2 mb-0" th:text="${evento.direccion}"></p>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card info-card shadow-sm p-4 sticky-top" style="top: 20px">
        <div class="precio-grande mb-1" th:text="${evento.precio} + ' €'"></div>
        <div class="small text-muted mb-4">por entrada</div>
        <div th:unless="${evento.tieneEntradas}"
             class="alert alert-danger text-center fw-bold mb-3">
          😔 Entradas agotadas
        </div>
        <a th:if="${evento.tieneEntradas}"
           th:href="@{/reservar/{id}(id=${evento.id})}"
           class="btn btn-lg w-100 fw-bold mb-3"
           style="background:#e94560; color:white; border:none">
          🎟️ Reservar entradas
        </a>
        <hr>
        <div class="small text-muted d-flex flex-column gap-2">
          <div>✅ Confirmación inmediata</div>
          <div>✅ Cancelación gratuita</div>
          <div>✅ Pago 100% seguro</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="app-data" th:data-username="${username}" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="/js/notificaciones.js"></script>
<script>
  const username = document.getElementById('app-data').dataset.username;
  if (username) conectarNotificaciones(username);
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const mapDiv = document.getElementById('map');
  const lat = parseFloat(mapDiv.dataset.lat);
  const lng = parseFloat(mapDiv.dataset.lng);
  const nombre = mapDiv.dataset.nombre;
  const direccion = mapDiv.dataset.direccion;
  const map = L.map('map').setView([lat, lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  L.marker([lat, lng]).addTo(map)
          .bindPopup(`<strong>${nombre}</strong><br><span style="color:#666">${direccion}</span>`)
          .openPopup();
</script>
</body>
</html>
