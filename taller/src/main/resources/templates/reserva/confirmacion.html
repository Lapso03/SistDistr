<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva confirmada · EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand span { color: #e94560; }
        .confirmacion-card { border: none; border-radius: 20px; max-width: 620px; margin: 0 auto; }
        .icono-check {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #28a745, #20c997);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; margin: 0 auto 20px;
        }
        .ticket { background: #f0f4ff; border-radius: 12px; border-left: 4px solid #e94560; }
        .localizador { font-family: monospace; font-size: 1.4rem; font-weight: 800; letter-spacing: 0.2em; color: #2c3e50; }
        .btn-misreservas { background: #2c3e50; color: white; border: none; font-weight: 600; }
        .btn-misreservas:hover { background: #1a252f; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4" style="background-color:#2c3e50">
    <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
    <div class="d-flex align-items-center gap-3">
        <a href="/usuario/reservas" class="btn btn-outline-light btn-sm">🎟️ Mis reservas</a>
        <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
    </div>
</nav>

<div class="container py-5">
    <div class="card confirmacion-card shadow-lg p-5 text-center">
        <div class="icono-check">✓</div>
        <h2 class="fw-bold mb-2">¡Reserva confirmada!</h2>
        <p class="text-muted mb-4">Tu reserva ha sido procesada correctamente. ¡Disfruta del evento!</p>

        <div class="mb-4">
            <div class="small text-muted mb-1">Localizador de reserva</div>
            <div class="localizador" th:text="'EVT-' + ${reserva.id}"></div>
        </div>

        <div class="ticket p-4 text-start mb-4">
            <div class="row g-3">
                <div class="col-12">
                    <div class="small text-muted">Evento</div>
                    <div class="fw-bold fs-5" th:text="${reserva.evento.nombre}"></div>
                </div>
                <div class="col-6">
                    <div class="small text-muted">Fecha</div>
                    <div class="fw-semibold"
                         th:text="${#temporals.format(reserva.evento.fecha, 'dd MMM yyyy')}"></div>
                </div>
                <div class="col-6">
                    <div class="small text-muted">Hora</div>
                    <div class="fw-semibold"
                         th:text="${#temporals.format(reserva.evento.fecha, 'HH:mm')}"></div>
                </div>
                <div class="col-6">
                    <div class="small text-muted">Lugar</div>
                    <div class="fw-semibold" th:text="${reserva.evento.lugar}"></div>
                </div>
                <div class="col-6">
                    <div class="small text-muted">Entradas</div>
                    <div class="fw-semibold" th:text="${reserva.numEntradas}"></div>
                </div>
                <div class="col-6">
                    <div class="small text-muted">Total pagado</div>
                    <div class="fw-bold text-danger fs-5" th:text="${reserva.precioTotal} + ' €'"></div>
                </div>
                <div class="col-6">
                    <div class="small text-muted">Estado</div>
                    <span class="badge bg-success">CONFIRMADA</span>
                </div>
            </div>
        </div>

        <div class="d-flex gap-3 justify-content-center">
            <a href="/" class="btn btn-outline-secondary px-4">Volver al inicio</a>
            <a href="/usuario/reservas" class="btn btn-misreservas px-4">🎟️ Ver mis reservas</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>
