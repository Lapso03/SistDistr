<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago · EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand span { color: #e94560; }
        .pago-card { border: none; border-radius: 16px; }
        .resumen-lateral { border: none; border-radius: 16px; background: #eaf0fb; }
        .total-pago { font-size: 1.8rem; font-weight: 800; color: #2c3e50; }
        .btn-pagar { background: #e94560; color: white; border: none; font-weight: 700; font-size: 1.1rem; }
        .btn-pagar:hover { background: #c73652; color: white; }
        .card-input { letter-spacing: 0.1em; font-family: monospace; font-size: 1.1rem; }
        .seguridad-badge { background: #e8f5e9; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; color: #2e7d32; }
        .step { color: #aaa; }
        .step.active { color: #2c3e50; font-weight: 700; }
        .step-sep { color: #ddd; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4" style="background-color:#2c3e50">
    <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
    <div class="d-flex align-items-center gap-3">
        <a href="/usuario/reservas" class="btn btn-outline-light btn-sm">🎟️ Mis reservas</a>
        <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
    </div>
</nav>

<div class="container py-5" style="max-width: 900px">

    <div class="d-flex align-items-center gap-2 mb-4 small">
        <span class="step">1. Selección</span>
        <span class="step-sep">›</span>
        <span class="step active">2. Pago</span>
        <span class="step-sep">›</span>
        <span class="step">3. Confirmación</span>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card pago-card shadow p-4">
                <h5 class="fw-bold mb-4">💳 Datos de pago</h5>
                <form th:action="@{/reservar/confirmar/{id}(id=${reserva.id})}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Número de tarjeta</label>
                        <input type="text" class="form-control card-input"
                               placeholder="1234 5678 9012 3456" maxlength="19"
                               id="cardNumber" required>
                        <div class="form-text">Introduce cualquier número para la demo</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Titular</label>
                        <input type="text" class="form-control"
                               placeholder="NOMBRE APELLIDO"
                               style="text-transform:uppercase" required>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-7">
                            <label class="form-label fw-semibold">Caducidad</label>
                            <input type="text" class="form-control card-input"
                                   placeholder="MM/AA" maxlength="5" id="expiry" required>
                        </div>
                        <div class="col-5">
                            <label class="form-label fw-semibold">CVV</label>
                            <input type="text" class="form-control card-input"
                                   placeholder="123" maxlength="3" required>
                        </div>
                    </div>
                    <div class="seguridad-badge mb-4">
                        🔒 Pago simulado — ningún dato es procesado ni almacenado
                    </div>
                    <button type="submit" class="btn btn-pagar btn-lg w-100">
                        Pagar <span th:text="${reserva.precioTotal} + ' €'"></span>
                    </button>
                </form>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card resumen-lateral p-4">
                <h6 class="fw-bold mb-3 text-muted text-uppercase" style="font-size:0.8rem">
                    Resumen de tu pedido
                </h6>
                <div class="fw-bold fs-5 mb-1" th:text="${evento.nombre}"></div>
                <div class="text-muted small mb-1">
                    📅 <span th:text="${#temporals.format(evento.fecha, 'dd MMM yyyy · HH:mm')}"></span>
                </div>
                <div class="text-muted small mb-3">
                    📍 <span th:text="${evento.lugar}"></span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Entradas</span>
                    <span th:text="${reserva.numEntradas}"></span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Precio unitario</span>
                    <span th:text="${evento.precio} + ' €'"></span>
                </div>
                <hr>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Total</span>
                    <span class="total-pago" th:text="${reserva.precioTotal} + ' €'"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
<script>
    document.getElementById('cardNumber').addEventListener('input', function(e) {
        let v = e.target.value.replace(/\D/g, '').substring(0, 16);
        e.target.value = v.replace(/(.{4})/g, '$1 ').trim();
    });
    document.getElementById('expiry').addEventListener('input', function(e) {
        let v = e.target.value.replace(/\D/g, '').substring(0, 4);
        if (v.length >= 2) v = v.substring(0, 2) + '/' + v.substring(2);
        e.target.value = v;
    });
</script>
</body>
</html>
