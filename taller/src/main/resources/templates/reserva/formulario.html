<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservar · EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand span { color: #e94560; }
        .resumen-card {
            border: none; border-radius: 16px;
            background: linear-gradient(135deg, #2c3e50 0%, #e94560 100%);
            color: white;
        }
        .form-card { border: none; border-radius: 16px; }
        .precio-total { font-size: 2rem; font-weight: 800; color: #e94560; }
        .btn-reservar { background: #e94560; color: white; border: none; font-weight: 700; }
        .btn-reservar:hover { background: #c73652; color: white; }
        .entrada-counter { width: 60px; text-align: center; font-weight: 700; font-size: 1.2rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4" style="background-color:#2c3e50">
    <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
    <div class="d-flex align-items-center gap-3">
        <a href="/usuario/reservas" class="btn btn-outline-light btn-sm">🎟️ Mis reservas</a>
        <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
    </div>
</nav>

<div class="container py-5" style="max-width: 800px">

    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/" class="text-decoration-none">Inicio</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/eventos/{id}(id=${evento.id})}"
                   th:text="${evento.nombre}" class="text-decoration-none"></a>
            </li>
            <li class="breadcrumb-item active">Reservar</li>
        </ol>
    </nav>

    <div class="card resumen-card shadow p-4 mb-4">
        <div class="row align-items-center">
            <div class="col-md-8">
                <span class="badge mb-2" style="background:#e94560" th:text="${evento.categoria}"></span>
                <h4 class="fw-bold mb-1" th:text="${evento.nombre}"></h4>
                <p class="small mb-1" style="color:rgba(255,255,255,0.75)">
                    📅 <span th:text="${#temporals.format(evento.fecha, 'dd MMM yyyy · HH:mm')}"></span>
                </p>
                <p class="small mb-0" style="color:rgba(255,255,255,0.75)">
                    📍 <span th:text="${evento.lugar}"></span>
                </p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <div class="fw-bold fs-4" th:text="${evento.precio} + ' €'"></div>
                <div class="small mt-1" style="color:rgba(255,255,255,0.75)"
                     th:text="${evento.aforoDisponible} + ' entradas disponibles'"></div>
            </div>
        </div>
    </div>

    <div class="card form-card shadow p-4">
        <h5 class="fw-bold mb-4">Selecciona tus entradas</h5>

        <form th:action="@{/reservar/{id}(id=${evento.id})}" method="post"
              th:data-precio="${evento.precio}"
              th:data-max="${evento.aforoDisponible}">

            <div class="mb-4">
                <label class="form-label fw-semibold">Número de entradas</label>
                <div class="d-flex align-items-center gap-3">
                    <button type="button" class="btn btn-outline-secondary px-3"
                            onclick="cambiarEntradas(-1)">−</button>
                    <input type="number" id="numEntradas" name="numEntradas"
                           class="form-control entrada-counter"
                           value="1" min="1"
                           th:max="${evento.aforoDisponible}" readonly>
                    <button type="button" class="btn btn-outline-secondary px-3"
                            onclick="cambiarEntradas(1)">+</button>
                    <span class="text-muted small">
                        máx. <span th:text="${evento.aforoDisponible}"></span>
                    </span>
                </div>
            </div>

            <div class="bg-light rounded p-3 mb-4">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Precio por entrada</span>
                    <span th:text="${evento.precio} + ' €'"></span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Número de entradas</span>
                    <span id="resumenEntradas">1</span>
                </div>
                <hr class="my-2">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Total</span>
                    <span class="precio-total" id="precioTotal"
                          th:text="${evento.precio} + ' €'"></span>
                </div>
            </div>

            <!-- Recordatorio -->
            <div class="mb-4 p-3 rounded" style="background:#eaf0fb">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                           name="recordatorio" id="recordatorio" value="true">
                    <label class="form-check-label fw-semibold" for="recordatorio">
                        🔔 Avisarme cuando el evento esté próximo (48h antes)
                    </label>
                    <div class="small text-muted mt-1">
                        Recibirás una notificación cuando el evento esté a menos de 48 horas
                    </div>
                </div>
            </div>

            <div class="d-flex gap-3">
                <a th:href="@{/eventos/{id}(id=${evento.id})}"
                   class="btn btn-outline-secondary flex-fill">Cancelar</a>
                <button type="submit" class="btn btn-reservar btn-lg flex-fill">
                    Continuar al pago →
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
<script>
    const form = document.querySelector('form');
    const precioPorEntrada = parseFloat(form.dataset.precio);
    const maxEntradas = parseInt(form.dataset.max);
    function cambiarEntradas(delta) {
        const input = document.getElementById('numEntradas');
        let valor = parseInt(input.value) + delta;
        if (valor < 1) valor = 1;
        if (valor > maxEntradas) valor = maxEntradas;
        input.value = valor;
        actualizarTotal(valor);
    }
    function actualizarTotal(n) {
        document.getElementById('resumenEntradas').textContent = n;
        document.getElementById('precioTotal').textContent =
            (precioPorEntrada * n).toFixed(2) + ' €';
    }
</script>
</body>
</html>
