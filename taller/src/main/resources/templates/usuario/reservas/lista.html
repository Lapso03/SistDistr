<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Reservas · EventApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
        crossorigin="anonymous">
  <style>
    body { background-color: #f5f6fa; }
    .navbar-brand span { color: #e94560; }
    .reserva-card { border: none; border-radius: 16px; transition: transform 0.2s, box-shadow 0.2s; }
    .reserva-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.10) !important; }
    .estado-confirmada { background: #d4edda; color: #155724; }
    .estado-pendiente  { background: #fff3cd; color: #856404; }
    .estado-cancelada  { background: #f8d7da; color: #721c24; }
    .borde-confirmada  { border-left: 4px solid #28a745 !important; }
    .borde-pendiente   { border-left: 4px solid #ffc107 !important; }
    .borde-cancelada   { border-left: 4px solid #dc3545 !important; }
    .localizador { font-family: monospace; font-weight: 700; color: #2c3e50; font-size: 0.9rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color:#2c3e50">
  <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMenu">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
      <li class="nav-item"><a class="nav-link" href="/eventos/buscar">Explorar eventos</a></li>
    </ul>
    <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
  </div>
</nav>

<div th:if="${param.pendiente}" class="alert alert-info text-center mb-0" style="border-radius:0">
  🔄 Tu solicitud de reserva está siendo procesada. Aparecerá en unos segundos.
</div>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1" style="color:#2c3e50">🎟️ Mis reservas</h2>
      <p class="text-muted mb-0">Gestiona todas tus entradas</p>
    </div>
    <a href="/eventos/buscar" class="btn fw-semibold"
       style="background:#e94560; color:white; border:none">+ Buscar eventos</a>
  </div>

  <div th:if="${#lists.isEmpty(reservas)}" class="text-center py-5">
    <div style="font-size:4rem">🎭</div>
    <h5 class="mt-3 fw-bold">Todavía no tienes reservas</h5>
    <p class="text-muted">Explora los eventos disponibles</p>
    <a href="/" class="btn btn-outline-secondary mt-2">Ver eventos</a>
  </div>

  <div class="d-flex flex-column gap-3" th:unless="${#lists.isEmpty(reservas)}">
    <div th:each="reserva : ${reservas}"
         class="card reserva-card shadow-sm p-4"
         th:classappend="${reserva.estado.name() == 'CONFIRMADA'} ? 'borde-confirmada' :
                             (${reserva.estado.name() == 'PENDIENTE'} ? 'borde-pendiente' : 'borde-cancelada')">
      <div class="row align-items-center g-3">
        <div class="col-md-6">
          <div class="localizador mb-1" th:text="'EVT-' + ${reserva.id}"></div>
          <div class="fw-bold fs-5" th:text="${reserva.evento.nombre}"></div>
          <div class="text-muted small mt-1">
            📅 <span th:text="${#temporals.format(reserva.evento.fecha, 'dd MMM yyyy · HH:mm')}"></span>
          </div>
          <div class="text-muted small">
            📍 <span th:text="${reserva.evento.lugar}"></span>
          </div>
        </div>
        <div class="col-md-3">
          <div class="small text-muted">Entradas</div>
          <div class="fw-semibold" th:text="${reserva.numEntradas}"></div>
          <div class="small text-muted mt-2">Total</div>
          <div class="fw-bold text-danger" th:text="${reserva.precioTotal} + ' €'"></div>
        </div>
        <div class="col-md-3 text-md-end d-flex flex-column align-items-md-end gap-2">
                    <span class="badge px-3 py-2 rounded-pill"
                          th:classappend="${reserva.estado.name() == 'CONFIRMADA'} ? 'estado-confirmada' :
                                         (${reserva.estado.name() == 'PENDIENTE'} ? 'estado-pendiente' : 'estado-cancelada')"
                          th:text="${reserva.estado}"></span>
          <div class="d-flex gap-2 justify-content-md-end">
            <a th:href="@{/usuario/reservas/{id}(id=${reserva.id})}"
               class="btn btn-sm btn-outline-secondary">Ver detalle</a>
            <form th:if="${reserva.estado.name() != 'CANCELADA'}"
                  th:action="@{/usuario/reservas/cancelar/{id}(id=${reserva.id})}"
                  method="post"
                  onsubmit="return confirm('¿Cancelar esta reserva?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="app-data" th:data-username="${username}" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="/js/notificaciones.js"></script>
<script>
  const username = document.getElementById('app-data').dataset.username;
  if (username) conectarNotificaciones(username);
</script>
</body>
</html>
