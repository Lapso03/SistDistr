<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle Reserva · EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand span { color: #e94560; }
        .detalle-card { border: none; border-radius: 16px; }
        .ticket-header {
            background: linear-gradient(135deg, #2c3e50 0%, #e94560 100%);
            border-radius: 16px 16px 0 0;
            color: white;
        }
        .ticket-body { border-radius: 0 0 16px 16px; border-top: 2px dashed #dfe6e9; }
        .localizador { font-family: monospace; font-size: 1.6rem; font-weight: 800; letter-spacing: 0.2em; }
        .estado-confirmada { background: #d4edda; color: #155724; }
        .estado-pendiente  { background: #fff3cd; color: #856404; }
        .estado-cancelada  { background: #f8d7da; color: #721c24; }
        .info-row { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .info-row:last-child { border-bottom: none; }
        .btn-cancelar { border-color: #dc3545; color: #dc3545; }
        .btn-cancelar:hover { background: #dc3545; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4" style="background-color:#2c3e50">
    <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
    <div class="d-flex align-items-center gap-3">
        <a href="/usuario/reservas" class="btn btn-outline-light btn-sm">🎟️ Mis reservas</a>
        <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
    </div>
</nav>

<div class="container py-5" style="max-width: 680px">

    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/" class="text-decoration-none">Inicio</a></li>
            <li class="breadcrumb-item">
                <a href="/usuario/reservas" class="text-decoration-none">Mis reservas</a>
            </li>
            <li class="breadcrumb-item active" th:text="'EVT-' + ${reserva.id}"></li>
        </ol>
    </nav>

    <div class="card detalle-card shadow-lg overflow-hidden">
        <div class="ticket-header p-4 text-center">
            <div class="small mb-1" style="color:rgba(255,255,255,0.7)">Localizador</div>
            <div class="localizador" th:text="'EVT-' + ${reserva.id}"></div>
            <div class="mt-3">
                <span class="badge px-3 py-2 rounded-pill fs-6"
                      th:classappend="${reserva.estado.name() == 'CONFIRMADA'} ? 'estado-confirmada' :
                                     (${reserva.estado.name() == 'PENDIENTE'} ? 'estado-pendiente' : 'estado-cancelada')"
                      th:text="${reserva.estado}"></span>
            </div>
        </div>

        <div class="ticket-body bg-white p-4">
            <div class="text-center mb-4">
                <h4 class="fw-bold" th:text="${reserva.evento.nombre}"></h4>
                <span class="badge" style="background:#2c3e50" th:text="${reserva.evento.categoria}"></span>
            </div>

            <div class="info-row d-flex justify-content-between">
                <span class="text-muted">Fecha del evento</span>
                <span class="fw-semibold"
                      th:text="${#temporals.format(reserva.evento.fecha, 'dd MMM yyyy')}"></span>
            </div>
            <div class="info-row d-flex justify-content-between">
                <span class="text-muted">Hora</span>
                <span class="fw-semibold"
                      th:text="${#temporals.format(reserva.evento.fecha, 'HH:mm')}"></span>
            </div>
            <div class="info-row d-flex justify-content-between">
                <span class="text-muted">Lugar</span>
                <span class="fw-semibold" th:text="${reserva.evento.lugar}"></span>
            </div>
            <div class="info-row d-flex justify-content-between align-items-center">
                <span class="text-muted">Dirección</span>
                <a th:href="'https://www.google.com/maps/dir/?api=1&destination=' + ${reserva.evento.latitud} + ',' + ${reserva.evento.longitud}"
                   target="_blank" class="fw-semibold text-decoration-none d-flex align-items-center gap-1"
                   style="color:#e94560">
                    📍 <span th:text="${reserva.evento.direccion}"></span> <small>↗</small>
                </a>
            </div>
            <div class="info-row d-flex justify-content-between">
                <span class="text-muted">Entradas</span>
                <span class="fw-semibold" th:text="${reserva.numEntradas}"></span>
            </div>
            <div class="info-row d-flex justify-content-between">
                <span class="text-muted">Precio por entrada</span>
                <span class="fw-semibold" th:text="${reserva.evento.precio} + ' €'"></span>
            </div>
            <div class="info-row d-flex justify-content-between">
                <span class="text-muted">Fecha de reserva</span>
                <span class="fw-semibold"
                      th:text="${#temporals.format(reserva.fechaReserva, 'dd MMM yyyy · HH:mm')}"></span>
            </div>
            <div class="info-row d-flex justify-content-between align-items-center">
                <span class="fw-bold fs-5">Total pagado</span>
                <span class="fw-bold fs-4 text-danger" th:text="${reserva.precioTotal} + ' €'"></span>
            </div>
        </div>
    </div>

    <div class="d-flex gap-3 mt-4 justify-content-center">
        <a href="/usuario/reservas" class="btn btn-outline-secondary px-4">← Volver</a>
        <form th:if="${reserva.estado.name() != 'CANCELADA'}"
              th:action="@{/usuario/reservas/cancelar/{id}(id=${reserva.id})}"
              method="post"
              onsubmit="return confirm('¿Cancelar esta reserva?')">
            <button type="submit" class="btn btn-cancelar px-4">Cancelar reserva</button>
        </form>
    </div>
</div>

<div id="app-data" th:data-username="${username}" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="/js/notificaciones.js"></script>
<script>
    const username = document.getElementById('app-data').dataset.username;
    if (username) conectarNotificaciones(username);
</script>
</body>
</html>
