<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error · EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand span { color: #e94560; }
        .error-card {
            max-width: 560px;
            margin: 80px auto;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
        }
        .error-header-critico {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            padding: 32px;
        }
        .error-header-warning {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
            padding: 32px;
        }
        .error-icon { font-size: 3rem; margin-bottom: 8px; }
        .error-body { padding: 28px 32px; background: white; }
        .error-footer { padding: 16px 32px 28px; background: white; border-top: 1px solid #dfe6e9; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4" style="background-color:#2c3e50">
    <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
    <a href="/" class="btn btn-outline-light btn-sm">Inicio</a>
</nav>

<div class="container">
    <div class="error-card">

        <div th:if="${critico}" class="error-header-critico text-center">
            <div class="error-icon">🔴</div>
            <h4 class="fw-bold mb-1" th:text="${titulo}">Error</h4>
            <small class="opacity-75">Error crítico del sistema</small>
        </div>

        <div th:unless="${critico}" class="error-header-warning text-center">
            <div class="error-icon">⚠️</div>
            <h4 class="fw-bold mb-1" th:text="${titulo}">Aviso</h4>
            <small class="opacity-75">Puedes continuar navegando</small>
        </div>

        <div class="error-body">
            <p class="text-muted mb-0" th:text="${mensaje}"></p>
        </div>

        <div class="error-footer d-flex gap-2">
            <a th:href="${volver}"
               class="btn btn-sm flex-fill"
               th:classappend="${critico} ? 'btn-outline-danger' : 'btn-outline-warning'"
               th:text="${volverTexto}"></a>
            <a href="/" class="btn btn-sm btn-outline-secondary flex-fill"
               th:if="${volver != '/'}">Ir al inicio</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>
