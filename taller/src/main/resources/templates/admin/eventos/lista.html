<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Eventos · EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand span { color: #e94560; }
        .tabla-eventos th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .evento-nombre { font-weight: 600; max-width: 200px; }
        .aforo-bar { height: 5px; width: 80px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color:#2c3e50">
    <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin">Panel Admin</a></li>
            <li class="nav-item"><a class="nav-link active" href="/admin/eventos">Eventos</a></li>
        </ul>
        <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1" style="color:#2c3e50">📋 Gestión de eventos</h2>
            <p class="text-muted mb-0" th:text="${#lists.size(eventos)} + ' eventos en total'"></p>
        </div>
        <a href="/admin/eventos/nuevo" class="btn fw-semibold"
           style="background:#e94560; color:white; border:none">+ Nuevo evento</a>
    </div>

    <div th:if="${#lists.isEmpty(eventos)}" class="text-center py-5 text-muted">
        <div style="font-size:3rem">📭</div>
        <h5 class="mt-3">No hay eventos creados todavía</h5>
        <a href="/admin/eventos/nuevo" class="btn btn-outline-secondary mt-2">Crear el primero</a>
    </div>

    <div th:unless="${#lists.isEmpty(eventos)}"
         class="card shadow-sm" style="border:none; border-radius:16px; overflow:hidden">
        <table class="table tabla-eventos table-hover mb-0">
            <thead style="background-color:#2c3e50; color:white">
            <tr>
                <th class="px-4 py-3">Evento</th>
                <th class="py-3">Categoría</th>
                <th class="py-3">Fecha</th>
                <th class="py-3">Precio</th>
                <th class="py-3">Aforo</th>
                <th class="py-3">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="evento : ${eventos}">
                <td class="px-4 py-3">
                    <div class="evento-nombre" th:text="${evento.nombre}"></div>
                    <div class="small text-muted" th:text="${evento.lugar}"></div>
                </td>
                <td class="py-3">
                    <span class="badge rounded-pill" style="background:#2c3e50"
                          th:text="${evento.categoria}"></span>
                </td>
                <td class="py-3">
                    <div class="small fw-semibold"
                         th:text="${#temporals.format(evento.fecha, 'dd MMM yyyy')}"></div>
                    <div class="small text-muted"
                         th:text="${#temporals.format(evento.fecha, 'HH:mm')}"></div>
                </td>
                <td class="py-3 fw-bold" th:text="${evento.precio} + ' €'"></td>
                <td class="py-3">
                    <div class="small mb-1"
                         th:text="${evento.aforoDisponible} + ' / ' + ${evento.aforo}"></div>
                    <div class="progress aforo-bar">
                        <div class="progress-bar"
                             th:style="'width:' + ${(evento.aforoOcupado * 100) / evento.aforo} + '%'"
                             th:classappend="${evento.aforoDisponible < 10} ? 'bg-danger' : 'bg-success'">
                        </div>
                    </div>
                </td>
                <td class="py-3">
                    <div class="d-flex gap-2">
                        <a th:href="@{/eventos/{id}(id=${evento.id})}"
                           class="btn btn-sm btn-outline-secondary" title="Ver">👁</a>
                        <a th:href="@{/admin/eventos/editar/{id}(id=${evento.id})}"
                           class="btn btn-sm btn-outline-primary" title="Editar">✏️</a>
                        <form th:action="@{/admin/eventos/eliminar/{id}(id=${evento.id})}"
                              method="post"
                              onsubmit="return confirm('¿Eliminar este evento?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">🗑</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>
