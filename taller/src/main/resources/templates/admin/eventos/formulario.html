<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${accion} + ' evento · EventApp'">Evento · EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand span { color: #e94560; }
        .form-card { border: none; border-radius: 16px; }
        .section-title {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
            color: #888; font-weight: 600; margin-bottom: 1rem;
            padding-bottom: 0.5rem; border-bottom: 1px solid #dfe6e9;
        }
        .btn-guardar { background: #e94560; color: white; border: none; font-weight: 700; }
        .btn-guardar:hover { background: #c73652; color: white; }
        #mapaAdmin { height: 300px; border-radius: 12px; border: 1px solid #dfe6e9; z-index: 0; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color:#2c3e50">
    <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/admin">Panel Admin</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/eventos">Eventos</a></li>
        </ul>
        <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
    </div>
</nav>

<div class="container py-5" style="max-width: 800px">

    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin" class="text-decoration-none">Admin</a></li>
            <li class="breadcrumb-item"><a href="/admin/eventos" class="text-decoration-none">Eventos</a></li>
            <li class="breadcrumb-item active" th:text="${accion} + ' evento'"></li>
        </ol>
    </nav>

    <div class="card form-card shadow p-5">
        <h4 class="fw-bold mb-4" th:text="${accion} + ' evento'"></h4>

        <form action="/admin/eventos/guardar" method="post" th:object="${evento}">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{aforoOcupado}">

            <div class="section-title">Información básica</div>
            <div class="row g-3 mb-4">
                <div class="col-12">
                    <label class="form-label fw-semibold">Nombre del evento *</label>
                    <input type="text" class="form-control" th:field="*{nombre}"
                           placeholder="Ej: Concierto de Jazz en el Sardinero" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Categoría *</label>
                    <select class="form-select" th:field="*{categoria}" required>
                        <option value="">Selecciona una categoría</option>
                        <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Fecha y hora *</label>
                    <input type="datetime-local" class="form-control" th:field="*{fecha}" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Descripción</label>
                    <textarea class="form-control" rows="3" th:field="*{descripcion}"
                              placeholder="Describe el evento..."></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">URL de imagen</label>
                    <input type="url" class="form-control" th:field="*{imagen}"
                           placeholder="https://ejemplo.com/imagen.jpg">
                    <div class="form-text">Opcional.</div>
                </div>
            </div>

            <div class="section-title">Ubicación</div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nombre del lugar *</label>
                    <input type="text" class="form-control" th:field="*{lugar}"
                           placeholder="Ej: Palacio de Festivales" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Dirección *</label>
                    <input type="text" class="form-control" th:field="*{direccion}"
                           placeholder="Ej: C/ Gamazo, 1, Santander" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Ubicación en el mapa *</label>
                    <p class="text-muted small mb-2">Haz clic en el mapa para marcar la ubicación</p>
                    <div id="mapaAdmin"></div>
                    <div class="row mt-2 g-2">
                        <div class="col-6">
                            <input type="number" class="form-control form-control-sm"
                                   id="latInput" th:field="*{latitud}"
                                   step="0.000001" placeholder="Latitud" readonly>
                        </div>
                        <div class="col-6">
                            <input type="number" class="form-control form-control-sm"
                                   id="lngInput" th:field="*{longitud}"
                                   step="0.000001" placeholder="Longitud" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-title">Entradas</div>
            <div class="row g-3 mb-5">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Precio por entrada (€) *</label>
                    <div class="input-group">
                        <input type="number" class="form-control" th:field="*{precio}"
                               step="0.01" min="0" placeholder="0.00" required>
                        <span class="input-group-text">€</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Aforo total *</label>
                    <input type="number" class="form-control" th:field="*{aforo}"
                           min="1" placeholder="Ej: 500" required>
                </div>
            </div>

            <div class="d-flex gap-3">
                <a href="/admin/eventos" class="btn btn-outline-secondary flex-fill">Cancelar</a>
                <button type="submit" class="btn btn-guardar btn-lg flex-fill"
                        th:text="${accion} + ' evento'">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const latInput = document.getElementById('latInput');
    const lngInput = document.getElementById('lngInput');
    const direccionInput = document.querySelector('input[name="direccion"]');

    // Catedral de Burgos por defecto
    const initLat = parseFloat(latInput.value) || 42.3408;
    const initLng = parseFloat(lngInput.value) || -3.7014;

    const map = L.map('mapaAdmin').setView([initLat, initLng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;

    if (latInput.value && lngInput.value) {
        marker = L.marker([initLat, initLng]).addTo(map);
    }

    // Clic en el mapa → poner marcador
    map.on('click', function(e) {
        const { lat, lng } = e.latlng;
        latInput.value = lat.toFixed(6);
        lngInput.value = lng.toFixed(6);
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
    });

    // Buscar dirección automáticamente al escribir
    let timeoutDireccion = null;
    direccionInput.addEventListener('input', function() {
        clearTimeout(timeoutDireccion);
        timeoutDireccion = setTimeout(() => {
            const query = direccionInput.value.trim();
            if (query.length < 5) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`)
                .then(r => r.json())
                .then(data => {
                    if (data.length === 0) return;
                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);
                    latInput.value = lat.toFixed(6);
                    lngInput.value = lng.toFixed(6);
                    map.setView([lat, lng], 16);
                    if (marker) map.removeLayer(marker);
                    marker = L.marker([lat, lng]).addTo(map);
                })
                .catch(() => {});
        }, 800); // espera 800ms tras dejar de escribir
    });
</script>
</body>
</html>
