<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title th:text="${accion} + ' usuario · EventApp'">Usuario · EventApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
        crossorigin="anonymous">
  <style>
    body { background-color: #f5f6fa; }
    .navbar-brand span { color: #e94560; }
    .form-card { border: none; border-radius: 16px; }
    .btn-guardar { background: #e94560; color: white; border: none; font-weight: 700; }
    .btn-guardar:hover { background: #c73652; color: white; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color:#2c3e50">
  <a class="navbar-brand fw-bold fs-4" href="/">Event<span>App</span></a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="/admin">Panel Admin</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/usuarios">Usuarios</a></li>
    </ul>
    <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
  </div>
</nav>

<div class="container py-5" style="max-width: 600px">

  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/admin" class="text-decoration-none">Admin</a></li>
      <li class="breadcrumb-item">
        <a href="/admin/usuarios" class="text-decoration-none">Usuarios</a>
      </li>
      <li class="breadcrumb-item active" th:text="${accion} + ' usuario'"></li>
    </ol>
  </nav>

  <div class="card form-card shadow p-5">
    <h4 class="fw-bold mb-4" th:text="${accion} + ' usuario'"></h4>

    <form action="/admin/usuarios/guardar" method="post">
      <input type="hidden" name="id" th:value="${usuario.id}">

      <div class="mb-3">
        <label class="form-label fw-semibold">Nombre de usuario *</label>
        <input type="text" class="form-control" name="username"
               th:value="${usuario.username}"
               required minlength="3" maxlength="50"
               placeholder="Mínimo 3 caracteres">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">
          Contraseña
          <span th:if="${usuario.id != null}"
                class="text-muted fw-normal small">
                        (dejar vacío para no cambiar)
                    </span>
          <span th:unless="${usuario.id != null}" class="text-danger">*</span>
        </label>
        <input type="password" class="form-control" name="password"
               th:required="${usuario.id == null}"
               minlength="6"
               placeholder="Mínimo 6 caracteres">
      </div>

      <div class="mb-3">
        <label>Email</label>
        <input type="email"
               name="email"
               th:value="${usuario.email}"
               class="form-control">
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Rol *</label>
        <select class="form-select" name="roleId" required>
          <option th:each="rol : ${roles}"
                  th:value="${rol.id}"
                  th:text="${rol.roleName}"
                  th:selected="${usuario.userRole != null and usuario.userRole.id == rol.id}">
          </option>
        </select>
      </div>

      <div class="d-flex gap-3">
        <a href="/admin/usuarios" class="btn btn-outline-secondary flex-fill">Cancelar</a>
        <button type="submit" class="btn btn-guardar btn-lg flex-fill"
                th:text="${accion} + ' usuario'">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>
